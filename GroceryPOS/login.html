
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLYQ - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth">

    <h2>GROCERY POS SYSTEM</h2>
    <h3>Login Account</h3>

    <form id="loginForm">

        <label>Username or Email</label>
        <input
            type="text"
            id="loginIdentity"
            placeholder="Enter username or email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="loginPassword"
            placeholder="Enter password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <p>
        Don't have an account?
        <button type="button" onclick="showRegister()">Register</button>
    </p>

</div>

<script>
function showRegister() {
    window.location.href = "register.html";
}

// LOGIN
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let users = JSON.parse(localStorage.getItem("gps_users")) || [];

    let identity = document.getElementById("loginIdentity").value.trim().toLowerCase();
    let password = document.getElementById("loginPassword").value;

    let user = users.find(u =>
        (u.username.toLowerCase() === identity ||
         u.email.toLowerCase() === identity) &&
        u.password === password
    );

    if (!user) {
        alert("Invalid username/email or password!");
        return;
    }

    localStorage.setItem("currentUser", JSON.stringify(user));

    alert("Welcome, " + user.name + "!");

    if (user.role === "Admin") {
        window.location.href = "admin.html";
    } else if (user.role === "Cashier") {
        window.location.href = "user.html";
    } else {
        alert("Invalid account role!");
        localStorage.removeItem("currentUser");
    }
});
</script>

</body>
</html>
