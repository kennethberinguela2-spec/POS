
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KLYQ System - Register</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth">

        <h2>KLYQ SYSTEM</h2>
        <h3>Create Account</h3>

        <form id="registerForm">

            <label for="regName">Full Name</label>
            <input
                type="text"
                id="regName"
                placeholder="Enter full name"
                required
            >

            <label for="regUser">Username</label>
            <input
                type="text"
                id="regUser"
                placeholder="Enter username"
                required
            >

            <label for="regEmail">Email</label>
            <input
                type="email"
                id="regEmail"
                placeholder="Enter email address"
                required
            >

            <label for="regPass">Password</label>
            <input
                type="password"
                id="regPass"
                minlength="6"
                placeholder="Create password"
                required
            >

            <label for="regConfirmPass">Confirm Password</label>
            <input
                type="password"
                id="regConfirmPass"
                minlength="6"
                placeholder="Confirm password"
                required
            >

            <label for="regRole">Register As</label>
            <select id="regRole" required>
                <option value="">Select Role</option>
                <option value="Admin">Admin</option>
                <option value="Cashier">Cashier</option>
            </select>

            <div id="adminCodeContainer" style="display: none;">
                <label for="adminCode">Admin Access Code</label>
                <input
                    type="password"
                    id="adminCode"
                    placeholder="Enter admin access code"
                >
            </div>

            <button type="submit">Register</button>

        </form>

        <p>
            Already have an account?
            <button type="button" onclick="showLogin()">
                Login
            </button>
        </p>

    </div>

    <script src="register.js"></script>

</body>
</html>
