
<!DOCTYPE html>
<html>
<head>
    <title>Grocery POS - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth">
    <h2>KLYQ SYSTEM</h2>
    <h3>Create Account</h3>

    <form id="register">

        <label>Register As</label>
        <select id="regRole" required>
            <option value="Cashier">Cashier</option>
            <option value="Admin">Admin</option>
        </select>

        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Enter full name" required>

        <label>Username</label>
        <input type="text" id="regUsername" placeholder="Enter username" required>

        <label>Email</label>
        <input type="email" id="regEmail" placeholder="Enter email" required>

        <label>Password</label>
        <input type="password" id="regPassword" minlength="6" placeholder="Create password" required>

        <label>Confirm Password</label>
        <input type="password" id="regConfirmPassword" placeholder="Confirm password" required>

        <div id="adminCodeSection" style="display:none;">
            <label>Admin Access Code</label>
            <input type="password" id="adminCode" placeholder="Enter admin access code">
        </div>

        <button type="submit">Register</button>

    </form>

    <p>Already have an account?
        <button type="button" onclick="showLogin()">Login</button>
    </p>
</div>

<script>

// DEMO ACCESS CODE ONLY
// In a real system, validate this securely on the server.
const ADMIN_CODE = "GROCERY2026";

function showLogin() {
    window.location.href = "login.html";
}

// SHOW ADMIN CODE FIELD
document.getElementById("regRole").addEventListener("change", function() {
    let section = document.getElementById("adminCodeSection");
    let code = document.getElementById("adminCode");

    if (this.value === "Admin") {
        section.style.display = "block";
        code.required = true;
    } else {
        section.style.display = "none";
        code.required = false;
        code.value = "";
    }
});

// REGISTER
document.getElementById("register").addEventListener("submit", function(e) {
    e.preventDefault();

    let users = JSON.parse(localStorage.getItem("gps_users")) || [];

    let name = document.getElementById("regName").value.trim();
    let username = document.getElementById("regUsername").value.trim();
    let email = document.getElementById("regEmail").value.trim();
    let password = document.getElementById("regPassword").value;
    let confirmPassword = document.getElementById("regConfirmPassword").value;
    let role = document.getElementById("regRole").value;
    let adminCode = document.getElementById("adminCode").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    if (role === "Admin" && adminCode !== ADMIN_CODE) {
        alert("Invalid Admin Access Code!");
        return;
    }

    let existingUser = users.find(user =>
        user.username.toLowerCase() === username.toLowerCase() ||
        user.email.toLowerCase() === email.toLowerCase()
    );

    if (existingUser) {
        alert("Username or email already exists!");
        return;
    }

    let newUser = {
        name: name,
        username: username,
        email: email,
        password: password,
        role: role
    };

    users.push(newUser);

    localStorage.setItem("gps_users", JSON.stringify(users));

    alert(role + " account successfully registered!");

    window.location.href = "login.html";
});
</script>

</body>
</html>
